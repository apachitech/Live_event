services:
  # 1. Main Web Application & Socket.IO Real-time API
  - type: web
    name: live-streaming-web
    env: node
    plan: starter
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: live-stream-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: live-stream-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CCBILL_ACCOUNT_NO
        sync: false
      - key: CCBILL_SUBACCOUNT_NO
        sync: false
      - key: CCBILL_SALT
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_HASH
        sync: false
      - key: STORAGE_PROVIDER
        value: local
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_DOMAIN
        sync: false
      - key: CLOUDINARY_URL
        sync: false

  # 2. Render Background Worker for Subscriptions, VOD Processing & Payouts
  - type: worker
    name: live-streaming-worker
    env: node
    plan: starter
    buildCommand: npm install && npx prisma generate
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: live-stream-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: live-stream-redis
          property: connectionString
      - key: STORAGE_PROVIDER
        value: local
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_DOMAIN
        sync: false

databases:
  # 3. Render Managed PostgreSQL
  - name: live-stream-postgres
    plan: starter
    databaseName: livestreampform
    user: liveuser

  # 4. Render Managed Redis Key Value Store
  - name: live-stream-redis
    plan: starter
    ipAllowList: [] # internal only
